name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'
      - name: Rozpakuj i zbuduj
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ZIP" || { echo "Brak pliku ZIP w repozytorium"; exit 1; }
          unzip -q "$ZIP" -d src
          DIR=$(dirname "$(find src -name settings.gradle | head -n 1)")
          gradle -p "$DIR" assembleDebug --no-daemon
          cp "$DIR/app/build/outputs/apk/debug/app-debug.apk" gokarty.apk
      - uses: actions/upload-artifact@v6
        with:
          name: gokarty-apk
          path: gokarty.apk
